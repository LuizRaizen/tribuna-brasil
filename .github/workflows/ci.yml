name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, testes, segurança)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tribuna
          POSTGRES_USER: tribuna
          POSTGRES_PASSWORD: tribuna
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tribuna" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://tribuna:tribuna@localhost:5432/tribuna
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tipos
        run: mypy .
      - name: Migrações pendentes
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Testes (PostgreSQL)
        run: pytest --cov=apps --cov-report=term-missing
      - name: Checagem de deploy
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-a-long-random-looking-value-for-checks
          DJANGO_ALLOWED_HOSTS: tribuna.example
          # A checagem exige SMTP real (tribuna.E001/E002); aqui só o formato importa.
          EMAIL_URL: smtp+tls://ci:ci@smtp.tribuna.invalid:587
          DEFAULT_FROM_EMAIL: Tribuna Brasil <nao-responda@tribuna.org.br>
      - name: Bandit
        run: bandit -q -c pyproject.toml -r apps config
      - name: Vulnerabilidades em dependências
        run: pip-audit --skip-editable

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes (componentes, integração e acessibilidade)
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilidades em dependências
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    name: E2E (Playwright)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra:
    name: Scripts e Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck deploy/*.sh
      - name: Validar docker-compose
        run: |
          cp deploy/env.prod.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml --profile tunnel config --quiet
          cp .env.example .env && docker compose config --quiet

  images:
    name: Build das imagens de produção
    needs: [backend, frontend, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A VM gratuita da Oracle é ARM (Ampere A1): as imagens precisam construir para arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend + Caddy
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # O deploy entra quando houver servidor de destino. Ele dependerá de todos os jobs acima,
  # de modo que código que falhe em qualquer etapa essencial nunca chega à produção.
